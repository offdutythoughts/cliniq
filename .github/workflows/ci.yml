name: CI

# Verifies the clinical content data + type-safety on every push to the deploy
# branches (main = Vercel previews, production = Vercel prod) and on every PR.
on:
  push:
    branches: [main, production]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm install --no-audit --no-fund

      # npm skips this one platform-specific optional native dep on the Linux
      # runner (npm/cli#4828), so vitest's rolldown engine can't find its
      # binding. Install it explicitly at the exact version of the resolved
      # rolldown (derived at runtime so it never drifts from the lockfile).
      - name: Ensure Linux rolldown binding (npm/cli#4828 workaround)
        run: npm install --no-save "@rolldown/binding-linux-x64-gnu@$(node -p "require('rolldown/package.json').version")"

      # Gating checks — a red here blocks the branch.
      - name: Type-check
        run: npx tsc --noEmit

      - name: Content lints (protocols · flows · blocks · lesions · chips · tiles)
        run: npm run lint:content

      - name: Tests (link-integrity · registry · allowlist)
        run: npm test
