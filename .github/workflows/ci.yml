name: CI

# Verifies the clinical content data + type-safety on every push to the deploy
# branches (main = Vercel previews, production = Vercel prod) and on every PR.
on:
  push:
    branches: [main, production]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `ci`, not `install`: install re-resolves and can build a tree the
      # lockfile never described, so CI stops being a check on what you pushed.
      - run: npm ci --no-audit --no-fund

      # npm skips this one platform-specific optional native dep on the Linux
      # runner (npm/cli#4828), so vitest's rolldown engine can't find its
      # binding. Install it explicitly at the exact version of the resolved
      # rolldown (derived at runtime so it never drifts from the lockfile).
      - name: Ensure Linux rolldown binding (npm/cli#4828 workaround)
        run: npm install --no-save "@rolldown/binding-linux-x64-gnu@$(node -p "require('rolldown/package.json').version")"

      # Gating checks — a red here blocks the branch.
      - name: Type-check
        run: npx tsc --noEmit

      - name: Content lints (protocols · flows · blocks · lesions · chips · tiles)
        run: npm run lint:content

      - name: Tests (link-integrity · registry · allowlist)
        run: npm test

      # The visual guardrail. It compares against __screenshots__/linux/, which
      # only this runner ever writes — see playwright.config.ts on why a macOS
      # baseline cannot gate a Linux render. If that directory is absent the
      # guardrail is unarmed, and Playwright would "pass" by silently writing new
      # baselines, so say so loudly instead of going green on nothing.
      - name: Check linux baselines exist
        id: baselines
        run: |
          if [ -d tests/visual/__screenshots__/linux ] && \
             [ -n "$(ls -A tests/visual/__screenshots__/linux 2>/dev/null)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Visual guardrail unarmed::No tests/visual/__screenshots__/linux baselines. Run Actions → 'Update visual baselines' to generate them."
          fi

      - name: Install Playwright chromium
        if: steps.baselines.outputs.present == 'true'
        run: npx playwright install --with-deps chromium

      # Built here rather than inside playwright's webServer, so a slow cold
      # build fails as a build error instead of a webServer timeout.
      - name: Build app for the visual run
        if: steps.baselines.outputs.present == 'true'
        run: NEXT_PUBLIC_CONVEX_URL= NEXT_DIST_DIR=.next-pw npx next build

      - name: Visual regression (60 screens · light + dark)
        if: steps.baselines.outputs.present == 'true'
        run: npx playwright test

      # The diff images are the only way to judge a visual failure, so keep them
      # when the job goes red.
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
