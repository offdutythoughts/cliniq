name: CI

# Verifies the clinical content data + type-safety on every push to the deploy
# branches (main = Vercel previews, production = Vercel prod) and on every PR.
#
# Two jobs, deliberately NOT chained. `verify` is cheap — type-check, content
# lints and unit tests, all of it CPU over an already-installed tree. `visual` is
# not: a chromium install, a production build, then 60 screens in two themes.
# Run in sequence, a one-character type error was reported only after the whole
# build had run ahead of it. Side by side, the cheap verdict lands in about the
# time `npm ci` takes and the expensive one arrives when it arrives.
#
# The cost is a second `npm ci`, mostly cache-served and small against the build
# it now runs beside. promote.sh is unaffected: it reads the conclusion of the
# RUN named "CI", which is green only when every job in it is.
on:
  push:
    branches: [main, production]
  pull_request:

# A compare gate only answers a question about the newest commit, so a push that
# supersedes a running check cancels it rather than paying for both. Run #166 sat
# "in progress" for twenty minutes against a commit two pushes stale, long after
# main had gone green on top of it — a red from a run like that means nothing and
# reads like a real failure in the list.
#
# Keyed on github.ref, so main, production and each PR queue separately: a
# production merge never cancels main's run, and a PR never cancels either.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── The cheap gates ─────────────────────────────────────────────────────────
  verify:
    runs-on: ubuntu-latest
    # Nothing here builds or renders, so a run this long is wedged, not slow.
    # Without a limit a hung step sits on GitHub's 360-minute default, burning
    # the runner and telling nobody anything.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Type-check
        run: npx tsc --noEmit

      - name: Content lints (protocols · flows · blocks · lesions · chips · tiles)
        run: npm run lint:content

      - name: Tests (link-integrity · registry · allowlist)
        run: npm test

  # ── The visual guardrail ────────────────────────────────────────────────────
  visual:
    runs-on: ubuntu-latest
    # A chromium install, a production build and 60 screens. Past this it is not
    # a slow build, it is a wedged one.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # It compares against __screenshots__/linux/, which only this runner ever
      # writes — see playwright.config.ts on why a macOS baseline cannot gate a
      # Linux render. If that directory is absent the guardrail is unarmed, and
      # Playwright would "pass" by silently writing new baselines, so say so
      # loudly instead of going green on nothing.
      #
      # How loudly depends on the branch. A warning annotation still leaves a
      # green checkmark, and on main and production that checkmark is what
      # promote.sh reads as permission to ship — a green meaning "skipped" is
      # exactly the verdict that gate must never receive. So a deploy branch
      # fails here. On PRs and feature branches nothing consumes the verdict, so
      # a warning is enough and `verify` still reports on its own.
      - name: Check linux baselines exist
        id: baselines
        env:
          BRANCH: ${{ github.ref_name }}
          DEPLOY_BRANCH: ${{ github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'production') }}
        run: |
          if [ -d tests/visual/__screenshots__/linux ] && \
             [ -n "$(ls -A tests/visual/__screenshots__/linux 2>/dev/null)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            if [ "$DEPLOY_BRANCH" = "true" ]; then
              echo "::error title=Visual guardrail unarmed::No tests/visual/__screenshots__/linux baselines on $BRANCH, and a green run on a deploy branch is what promote.sh ships on. Run Actions → 'Update visual baselines' to generate them."
              exit 1
            fi
            echo "::warning title=Visual guardrail unarmed::No tests/visual/__screenshots__/linux baselines. Run Actions → 'Update visual baselines' to generate them."
          fi

      - uses: ./.github/actions/visual-build
        if: steps.baselines.outputs.present == 'true'

      - name: Visual regression (60 screens · light + dark)
        if: steps.baselines.outputs.present == 'true'
        run: npx playwright test

      # The diff images are the only way to judge a visual failure, so keep them
      # when the job goes red.
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
