name: Update visual baselines

# Regenerates tests/visual/__screenshots__/linux/ on the ubuntu runner, verifies
# the set it just rendered actually passes a strict compare, and commits it back
# to the branch you ran this on — except `production`, which is redirected to
# `main`. See "Never production" below.
#
# This exists because the committed baselines have to be rendered by the same
# font stack that CI renders with, and no developer machine here is Linux. Run it
# from Actions → "Update visual baselines" → Run workflow, after any change that
# legitimately moves pixels. Never hand-edit the linux/ directory.
#
# There are two ways to ask for a regen, and they do the same thing:
#
#   1. Actions → "Update visual baselines" → Run workflow (pick the branch).
#   2. Edit .github/visual-baselines-request, commit, push.
#
# (2) exists because (1) needs the Actions UI — a wide-enough window to see the
# workflow sidebar, and a human at the keyboard. A push is reachable from a
# terminal, a phone, or an agent working on the repo. The path filter is what
# keeps this honest: ONLY a commit touching that one sentinel file regenerates
# anything, so the guardrail stays opt-in and no ordinary content commit can
# quietly rewrite its own baselines.
#
# ── Never production ─────────────────────────────────────────────────────────
#
# `production` is a deploy branch: it is `main` plus one file, and it should
# only ever receive content by merging main. But merging main into it carries
# the sentinel's diff along, which re-triggers this workflow with
# github.ref_name = production, and it used to commit baselines straight there.
# That left production holding baseline commits main did not have — a second
# divergence that nobody asked for and that the next merge had to clean up.
#
# So a request that resolves to `production` is redirected to `main`: we check
# main out, render from main, and push there. Baselines then reach production
# the same way everything else does, by merge. Any other branch still gets its
# own baselines in place, which is what a feature branch that moves pixels
# needs — and note this is why the redirect is production-specific rather than
# "always push to main": baselines rendered from a feature branch's code must
# never be committed onto main, where that code does not exist.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to regenerate and commit on (production redirects to main)
        required: true
        default: main
  push:
    # Not production: a promote merges main's sentinel diff across, which fired
    # this workflow a second time for no gain — the redirect below sent it
    # straight back to main, where the baselines it would render are already
    # current. workflow_dispatch can still name production; the redirect stays
    # for that path.
    branches-ignore: [production]
    paths:
      - .github/visual-baselines-request

# Two regens racing on the same branch would both try to push, and the loser
# fails on a non-fast-forward. Queue them instead — never cancel, because a
# half-finished baseline set is worse than a slow one.
#
# Keyed on the RESOLVED target, not the requesting ref: a production push and a
# main push both land on main, and keying on the requester would put them in
# different groups and let them race exactly as this is meant to prevent.
concurrency:
  group: visual-baselines-${{ (inputs.branch || github.ref_name) == 'production' && 'main' || (inputs.branch || github.ref_name) }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    # Two playwright passes plus a build. Anything past this is wedged, and the
    # 360-minute default would hold the concurrency group — which never cancels —
    # against every regen queued behind it.
    timeout-minutes: 25
    steps:
      # workflow_dispatch names the branch as an input; a sentinel push carries
      # it as the ref that was pushed. Either way production means main.
      - name: Resolve the target branch
        id: target
        env:
          REQUESTED: ${{ inputs.branch || github.ref_name }}
        run: |
          set -euo pipefail
          requested="$REQUESTED"
          if [ "$requested" = "production" ]; then
            target=main
            echo "::notice title=Redirected to main::production is a deploy branch and takes content only by merge from main, so these baselines were rendered from main and pushed there. Merge main into production to carry them across."
          else
            target="$requested"
          fi
          echo "Requested: $requested → target: $target"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.target }}

      - uses: ./.github/actions/setup
      - uses: ./.github/actions/visual-build

      # --update-snapshots rewrites every baseline; exit code is not meaningful
      # here because "snapshot did not exist, wrote it" is a failure to Playwright
      # and is exactly what we want on the first run.
      - name: Regenerate baselines
        run: npx playwright test --update-snapshots || true

      # The regen pass writes whatever it renders and swallows its exit code, so
      # on its own it proves nothing about the set it just produced. Compare
      # against that set once, strictly — playwright.config.ts pins
      # updateSnapshots to 'none' and only the line above overrides it, so this
      # pass cannot write. Two things fall out. A screen that renders differently
      # on two consecutive runs is flake, and it gets caught here instead of on
      # someone's unrelated PR. And the assertions that are not screenshots at
      # all — fits.spec.ts's page-overflow checks, the pinned tab-2-disease row
      # count — have to hold before this set is worth committing.
      #
      # A failure here stops the commit step on its own (steps default to
      # if: success()), which is the point: nothing lands unverified.
      #
      # This also retires the ceremony that used to follow a bot push. Baselines
      # land via GITHUB_TOKEN, which by design starts no workflow, so the branch
      # sat at a commit CI had never seen and promote.sh waved it through on its
      # "no run at all" branch. Verifying here is what makes that commit
      # trustworthy — see 405d3f6, 4dbfbc4 and 8e771be, three commits whose only
      # job was to make CI run again on top of one of these.
      - name: Verify the regenerated baselines
        run: npx playwright test

      # A verify failure means the set is not committable, and the diff images
      # are the only way to see why.
      - name: Upload verification report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-verification-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Commit baselines
        env:
          TARGET_BRANCH: ${{ steps.target.outputs.target }}
        run: |
          set -euo pipefail
          target="$TARGET_BRANCH"
          echo "Regenerating baselines on $target"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tests/visual/__screenshots__/linux
          if git diff --cached --quiet; then
            echo "Baselines already current — nothing to commit."
            exit 0
          fi
          count=$(git diff --cached --name-only | wc -l | tr -d ' ')
          git diff --cached --name-only
          git commit -m "test(visual): regenerate $count linux baselines on the CI runner"

          # This job takes ~2 minutes, and anything pushed to the branch inside
          # that window leaves our push non-fast-forward. Baselines are whole
          # files that nobody edits by hand, so rebasing onto whatever landed is
          # safe — replay and retry rather than dying and making a human re-run.
          #
          # Pushed with GITHUB_TOKEN, which by design does not trigger workflows,
          # so this commit starts no CI run and cannot re-trigger this one.
          for attempt in 1 2 3; do
            if git push origin "HEAD:$target"; then
              echo "Pushed $count baselines to $target on attempt $attempt."
              exit 0
            fi
            echo "Push rejected — $target moved under us. Rebasing and retrying."
            git fetch origin "$target"
            git rebase "origin/$target"
          done
          echo "::error title=Baseline push failed::Three pushes to $target were rejected."
          exit 1
