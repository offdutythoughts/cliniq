name: Update visual baselines

# Regenerates tests/visual/__screenshots__/linux/ on the ubuntu runner and commits
# it back to the branch you ran this on.
#
# This exists because the committed baselines have to be rendered by the same
# font stack that CI renders with, and no developer machine here is Linux. Run it
# from Actions → "Update visual baselines" → Run workflow, after any change that
# legitimately moves pixels. Never hand-edit the linux/ directory.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to regenerate and commit on
        required: true
        default: main

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Ensure Linux rolldown binding (npm/cli#4828 workaround)
        run: npm install --no-save "@rolldown/binding-linux-x64-gnu@$(node -p "require('rolldown/package.json').version")"

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Build app for the visual run
        run: NEXT_PUBLIC_CONVEX_URL= NEXT_DIST_DIR=.next-pw npx next build

      # --update-snapshots rewrites every baseline; exit code is not meaningful
      # here because "snapshot did not exist, wrote it" is a failure to Playwright
      # and is exactly what we want on the first run.
      - name: Regenerate baselines
        run: npx playwright test --update-snapshots || true

      - name: Commit baselines
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tests/visual/__screenshots__/linux
          if git diff --cached --quiet; then
            echo "Baselines already current — nothing to commit."
            exit 0
          fi
          count=$(git diff --cached --name-only | wc -l | tr -d ' ')
          git commit -m "test(visual): regenerate $count linux baselines on the CI runner"
          git push origin HEAD:${{ inputs.branch }}
